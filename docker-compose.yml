version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: swiftbill_user
      POSTGRES_PASSWORD: swiftbill_password
      POSTGRES_DB: swiftbill
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
